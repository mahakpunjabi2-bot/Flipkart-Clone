<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Flipkart</title>
    <link rel="stylesheet" href="./flip.css">
    <link rel="icon" href="https://static-assets-web.flixcart.com/www/promos/new/20150528-140547-favicon-retina.ico">
</head>

<body class="auth-body">
    <!-- Navbar (Simplified for Auth Page) -->
    <header>
        <div class="navbar-container">
            <div class="logo-container">
                <a href="./flip.html">
                    <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/flipkart-plus_8d85f4.png"
                        alt="Flipkart" class="logo-img">
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-left">
                <h2>Looks like you're new here!</h2>
                <p>Sign up with your mobile number to get started</p>
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/login_img_c4a81e.png"
                    alt="Login Image">
            </div>
            <div class="auth-right">
                <form action="#" class="auth-form">
                    <div class="input-group">
                        <input type="text" required>
                        <label>Enter Mobile number</label>
                    </div>
                    <div class="input-group">
                        <input type="text" required>
                        <label>Enter Name</label>
                    </div>
                    <div class="input-group">
                        <input type="email" required>
                        <label>Enter Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" required>
                        <label>Set Password</label>
                    </div>

                    <p class="terms">By continuing, you agree to Flipkart's <a href="#">Terms of Use</a> and <a
                            href="#">Privacy Policy</a>.</p>

                    <button type="submit" class="auth-btn">CONTINUE</button>
                    <a href="./flip.html" class="existing-user-btn">Existing User? Log in</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
