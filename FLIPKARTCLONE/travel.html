<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore Plus | Travel</title>
    <link rel="stylesheet" href="travel.css">
</head>

<body>

    <!-- Top Bar / Header -->
    <header>
        <div class="navbar-container">
            <a href="#" class="brand-logo">
                MyStore <span class="plus-text">Plus</span>
                <span class="travel-label">Travel</span>
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">Get. Set. Travel.</h1>

            <!-- Flight Search Card -->
            <div class="search-card">
                <div class="trip-type">
                    <label class="radio-group">
                        <input type="radio" name="trip" value="one-way" checked>
                        One Way
                    </label>
                    <label class="radio-group">
                        <input type="radio" name="trip" value="round-trip">
                        Round Trip
                    </label>
                </div>

                <div class="search-inputs">
                    <div class="input-field">
                        <span class="input-label">From</span>
                        <input type="text" class="input-control" placeholder="Any worldwide city or airport">
                    </div>

                    <div class="input-field">
                        <span class="input-label">To</span>
                        <input type="text" class="input-control" placeholder="Any worldwide city or airport">
                    </div>

                    <div class="input-field">
                        <span class="input-label">Depart On</span>
                        <input type="date" class="input-control">
                    </div>

                    <div class="input-field">
                        <span class="input-label">Return On</span>
                        <input type="date" class="input-control" disabled id="returnDate">
                    </div>

                    <div class="input-field">
                        <span class="input-label">Travellers | Class</span>
                        <select class="input-control">
                            <option>1 Traveller, Economy</option>
                            <option>2 Travellers, Economy</option>
                            <option>1 Traveller, Business</option>
                        </select>
                    </div>

                    <button class="search-btn">SEARCH</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Offer Banner -->
    <div class="offer-banner">
        <div class="offer-text">
            <h2>Up to 24% Off – All Seats. All Flights.</h2>
            <p>Fly to Kuala Lumpur · Bangkok · Phuket</p>
        </div>
        <div class="offer-icons">
            <div class="generic-icon">✈️</div>
            <div class="generic-icon">🌏</div>
            <div class="generic-icon">🌴</div>
        </div>
    </div>

    <!-- Script to handle Round Trip toggle -->
    <script>
        const tripRadios = document.querySelectorAll('input[name="trip"]');
        const returnDateInput = document.getElementById('returnDate');

        tripRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'round-trip') {
                    returnDateInput.disabled = false;
                    returnDateInput.focus();
                } else {
                    returnDateInput.disabled = true;
                    returnDateInput.value = '';
                }
            });
        });
    </script>
</body>

</html>
